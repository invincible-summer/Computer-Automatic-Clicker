name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "src/MacroClicker.Mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

# 需要 write 权限：构建产物（APK 与固定签名密钥）自动提交回仓库
permissions:
  contents: write

jobs:
  build:
    name: 构建并入库手机版 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/MacroClicker.Mobile

    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 准备固定签名密钥（首次生成并入库，保证每次构建签名一致）
        run: |
          KS=release.keystore
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v \
              -keystore "$KS" -storetype PKCS12 \
              -alias macroclicker -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass macroclicker2020 -keypass macroclicker2020 \
              -dname "CN=Macro Clicker, OU=MacroClicker, O=MacroClicker, C=CN"
            echo "GENERATED_NEW_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

      - name: 构建 Release APK
        env:
          MC_KEYSTORE: release.keystore
          MC_STORE_PASS: macroclicker2020
          MC_KEY_ALIAS: macroclicker
          MC_KEY_PASS: macroclicker2020
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee gradle-build.log

      - name: 构建失败时输出错误摘要（注解）并推送日志分支
        if: failure()
        working-directory: src/MacroClicker.Mobile
        run: |
          set +e
          # FAILURE 块完整作为注解输出
          sed -n '/FAILURE: Build failed/,/^$/p' gradle-build.log | head -40 | while IFS= read -r line; do
            echo "::error::$GITHUB_RUN_NUMBER|$line"
          done
          grep -i -n "aidl" gradle-build.log | grep -vi "compileReleaseAidl\|AidlCompile'" | head -20 | while IFS= read -r line; do
            echo "::error::$GITHUB_RUN_NUMBER|AIDL|$line"
          done
          # 完整日志推到 ci-logs 分支（基于 main，非 orphan）
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p .debug && cp gradle-build.log .debug/
          git add -f .debug/gradle-build.log
          git commit -m "ci-debug: build log for run $GITHUB_RUN_NUMBER"
          git push --force origin ci-logs
          exit 1

      - name: 整理产物到 publish/android（替换旧 APK）
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p ../../publish/android
          rm -f ../../publish/android/*.apk
          cp app/build/outputs/apk/release/app-release.apk "../../publish/android/MacroClicker-v${VERSION}-android.apk"
          ls -lh ../../publish/android

      - name: 提交 APK（与新生成的密钥）回仓库
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/android
          [ -f "src/MacroClicker.Mobile/release.keystore" ] && git add "src/MacroClicker.Mobile/release.keystore"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "ci: 更新 Android APK 产物 (v${VERSION})"
            git push
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: MacroClicker-Android-APK
          path: publish/android/*.apk
          if-no-files-found: error
